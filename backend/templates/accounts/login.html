{% extends 'base.html' %}

{% block title %}Вход - Ассистент ДТП{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Вход</h1>
    <p class="auth-subtitle">Войдите в свой аккаунт</p>

    {% if error %}
        <div class="form-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="contact">Email или телефон</label>
            <input type="text" id="contact" name="contact" placeholder="you@example.com или +7XXXXXXXXXX" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <div class="auth-footer">
        Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a>
    </div>
</div>

<style>
.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f5;
    padding: 20px;
}

.auth-card {
    background: white;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.auth-card h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #18181b;
}

.auth-subtitle {
    font-size: 14px;
    color: #71717a;
    margin-bottom: 24px;
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 14px;
    font-weight: 500;
    color: #3f3f46;
}

.form-group input {
    padding: 10px 14px;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    font-size: 14px;
    background: #fafafa;
    transition: border-color 0.2s;
}

.form-group input:focus {
    outline: none;
    border-color: #18181b;
}

.form-error {
    font-size: 13px;
    color: #b91c1c;
    background: #fef2f2;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #fecaca;
    margin-bottom: 16px;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
}

.btn-primary {
    background: #18181b;
    color: white;
}

.btn-primary:hover {
    background: #27272a;
}

.btn-block {
    width: 100%;
}

.auth-footer {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
    color: #71717a;
}

.auth-footer a {
    color: #18181b;
    font-weight: 500;
    text-decoration: none;
}

.auth-footer a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
