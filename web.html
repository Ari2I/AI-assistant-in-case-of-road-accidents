<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Оформление ДТП — фото</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f4f4f5;
      --card-bg: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --primary: #18181b;
      --accent: #0f766e;
      --danger: #b91c1c;
      --radius-lg: 16px;
      --radius-md: 10px;
      --progress-height: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 16px 16px 18px;
    }

    /* Верхняя панель с прогрессом */
    .top-bar {
      margin-bottom: 16px;
    }

    .top-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .top-title {
      font-size: 17px;
      font-weight: 600;
    }

    .step-label {
      font-size: 12px;
      color: var(--muted);
    }

    .progress-wrapper {
      width: 100%;
      background: #e4e4e7;
      border-radius: 999px;
      overflow: hidden;
      height: var(--progress-height);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #18181b;
      transition: width 0.15s ease;
    }

    /* Кнопки регистрация / вход */
    .auth-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }

    .auth-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fafafa;
      color: var(--text);
      font-size: 11px;
      padding: 6px 11px;
      cursor: pointer;
    }

    .auth-btn:hover {
      background: #e5e5e5;
    }

    /* Основной блок */
    .content {
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 14px 12px 14px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    /* Выбор сценария */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .option-card {
      border-radius: var(--radius-md);
      padding: 10px 10px;
      background: #f9fafb;
      border: 1px solid var(--border);
      display: flex;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
    }

    .option-card.selected {
      border-color: #18181b;
      background: #ffffff;
    }

    .option-radio {
      margin-top: 2px;
    }

    .option-body {
      flex: 1;
    }

    .option-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .option-description {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .option-tag {
      font-size: 11px;
      color: var(--danger);
      margin-top: 4px;
    }

    .option-tag.green {
      color: var(--accent);
    }

    .diff-block {
      margin-top: 6px;
      padding: 7px 8px;
      border-radius: 8px;
      background: #f4f4f5;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .diff-title {
      font-weight: 600;
      margin-bottom: 3px;
      color: #27272a;
      font-size: 11px;
    }

    /* Блок фотосъемки */
    .camera-section {
      margin-top: 16px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #0a0a0a;
      margin-bottom: 12px;
      aspect-ratio: 4/3;
    }

    #video, #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #canvas {
      display: none;
    }

    .camera-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn-camera {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-camera.primary {
      background: var(--primary);
      color: white;
      border: none;
    }

    .btn-camera:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-camera.danger {
      background: var(--danger);
      color: white;
      border: none;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .photo-item {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-item .remove-photo {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .photo-hint {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .photo-hint span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Навигация между шагами */
    .step-navigation {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .step-navigation button {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-next {
      background: var(--primary);
      border: none;
      color: white;
    }

    .btn-next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Модалка авторизации */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.3);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px 16px 0 0;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--border);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 600;
    }

    .sheet-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 2px;
    }

    .sheet-body {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
    }

    .field input {
      padding: 8px 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fafafa;
      color: var(--text);
      font-size: 13px;
    }

    .field input:focus {
      outline: none;
      border-color: #18181b;
    }

    .sheet-footer {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .btn-ghost {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 11px;
      padding: 7px 10px;
      cursor: pointer;
    }

    .legal {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 12px 12px 14px;
        border-radius: 14px;
      }

      .content {
        padding: 12px 10px;
      }

      .photos-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Кнопки регистрации / входа -->
    <div class="auth-bar">
      <button class="auth-btn" id="loginBtn">Вход</button>
      <button class="auth-btn" id="signupBtn">Регистрация</button>
    </div>

    <!-- Верх прогресса -->
    <div class="top-bar">
      <div class="top-bar-header">
        <div>
          <div class="top-title">Оформление ДТП</div>
          <div class="step-label" id="stepLabel">Шаг 1 из 4</div>
        </div>
      </div>
      <div class="progress-wrapper">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- Динамический контент -->
    <div class="content" id="content">
      <!-- Сюда будет подгружаться текущий шаг -->
    </div>
  </div>

  <!-- Модалка вход/регистрация (без изменений) -->
  <div class="modal-backdrop" id="authModal">
    <!-- ... содержимое модалки как в вашем коде ... -->
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="sheet-header">
        <div class="sheet-title" id="authTitle">Вход</div>
        <button class="sheet-close" id="authClose" aria-label="Закрыть">×</button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="email">E‑mail</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" name="password" placeholder="••••••••" />
        </div>
        <div class="field" id="repeatField" style="display: none;">
          <label for="password2">Повторите пароль</label>
          <input id="password2" type="password" name="password2" placeholder="••••••••" />
        </div>
        <div class="legal" id="legalText">
          Используйте e‑mail и пароль, указанные при регистрации.
        </div>
      </div>
      <div class="sheet-footer">
        <button class="btn-primary" id="authSubmit">Войти</button>
        <button class="btn-ghost" id="toggleMode">Нет аккаунта? Регистрация</button>
      </div>
    </div>
  </div>

  <script>
    // Состояние приложения
    const state = {
      currentStep: 1,
      selectedType: null,
      photos: [],
      totalSteps: 4
    };

    // Прогресс бар
    const progressBar = document.getElementById('progressBar');
    const stepLabel = document.getElementById('stepLabel');
    const contentDiv = document.getElementById('content');

    // Обновление прогресса
    function updateProgress() {
      const percent = (state.currentStep / state.totalSteps) * 100;
      progressBar.style.width = percent + '%';
      stepLabel.textContent = `Шаг ${state.currentStep} из ${state.totalSteps}`;
    }

    // Рендер текущего шага
    function renderStep() {
      if (state.currentStep === 1) {
        renderStep1();
      } else if (state.currentStep === 2) {
        renderStep2();
      }
      updateProgress();
    }

    // Шаг 1: выбор типа ДТП
    function renderStep1() {
      contentDiv.innerHTML = `
        <div class="subtitle">Выберите, что произошло</div>
        <div class="section-title">Тип происшествия</div>

        <div class="options">
          <!-- Серьёзное ДТП -->
          <div class="option-card" data-type="serious">
            <input type="radio" name="accident_type" class="option-radio" aria-label="Серьёзное ДТП" />
            <div class="option-body">
              <div class="option-title">Серьёзное ДТП</div>
              <div class="option-description">
                Есть пострадавшие, большой ущерб или спорная ситуация.
              </div>
              <div class="option-tag">
                Обычно требуется вызов ГИБДД
              </div>
              <div class="diff-block">
                <div class="diff-title">Чем отличается от европротокола</div>
                <div>
                  Используется, если есть раненные или погибшие, ущерб
                  предположительно выше лимита по ОСАГО, много машин или участники
                  не согласны между собой.
                </div>
              </div>
            </div>
          </div>

          <!-- Европротокол -->
          <div class="option-card" data-type="euro">
            <input type="radio" name="accident_type" class="option-radio" aria-label="Европротокол" />
            <div class="option-body">
              <div class="option-title">Европротокол</div>
              <div class="option-description">
                Только ущерб автомобилю, нет пострадавших, участники согласны.
              </div>
              <div class="option-tag green">
                Можно оформить без вызова ГИБДД
              </div>
              <div class="diff-block">
                <div class="diff-title">Чем отличается от серьёзного ДТП</div>
                <div>
                  Применяется при двух участниках с полисами ОСАГО, без вреда
                  жизни и здоровью, когда стороны согласны и ущерб не превышает
                  установленный законом лимит.
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="step-navigation">
          <button class="btn-next" id="nextBtn" disabled>Далее</button>
        </div>
      `;

      // Логика для шага 1
      const optionCards = document.querySelectorAll('.option-card');
      const nextBtn = document.getElementById('nextBtn');

      optionCards.forEach(card => {
        card.addEventListener('click', () => {
          optionCards.forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          const radio = card.querySelector('input[type="radio"]');
          if (radio) radio.checked = true;

          state.selectedType = card.dataset.type;
          nextBtn.disabled = false;
        });
      });

      nextBtn.addEventListener('click', () => {
        if (state.selectedType) {
          state.currentStep = 2;
          renderStep();
        }
      });
    }

    // Шаг 2: фотосъемка
    function renderStep2() {
      contentDiv.innerHTML = `
        <div class="subtitle">Сделайте фотографии</div>
        <div class="section-title">Фото с места ДТП</div>

        <div class="photo-hint">
          <span>📸 Общий план</span>
          <span>🚗 Номера машин</span>
          <span>⚡ Повреждения</span>
          <span>📍 Знаки и разметка</span>
        </div>

        <div class="camera-section">
          <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
          </div>

          <div class="camera-controls">
            <button class="btn-camera" id="startCameraBtn" title="Включить камеру">
              📷 Включить камеру
            </button>
            <button class="btn-camera primary" id="captureBtn" disabled>
              Сделать фото
            </button>
            <button class="btn-camera" id="switchCameraBtn" disabled>
              🔄 Переключить камеру
            </button>
          </div>

          <div class="photos-grid" id="photosGrid">
            ${renderPhotosGrid()}
          </div>

          <div class="step-navigation">
            <button class="btn-back" id="backBtn">Назад</button>
            <button class="btn-next" id="nextStepBtn" ${state.photos.length === 0 ? 'disabled' : ''}>
              Далее (${state.photos.length} фото)
            </button>
          </div>
        </div>
      `;

      // Инициализация камеры
      let stream = null;
      let currentFacingMode = 'environment'; // по умолчанию основная камера
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const startBtn = document.getElementById('startCameraBtn');
      const captureBtn = document.getElementById('captureBtn');
      const switchBtn = document.getElementById('switchCameraBtn');
      const backBtn = document.getElementById('backBtn');
      const nextBtn = document.getElementById('nextStepBtn');

      async function startCamera(facingMode = currentFacingMode) {
        try {
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }

          const constraints = {
            video: {
              facingMode: facingMode,
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          };

          stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          await video.play();

          startBtn.textContent = '📷 Камера активна';
          captureBtn.disabled = false;
          switchBtn.disabled = false;

        } catch (err) {
          console.error('Ошибка доступа к камере:', err);
          alert('Не удалось получить доступ к камере. Проверьте разрешения.');
          startBtn.textContent = '📷 Разрешить камеру';
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
          video.srcObject = null;
          startBtn.textContent = '📷 Включить камеру';
          captureBtn.disabled = true;
          switchBtn.disabled = true;
        }
      }

      function capturePhoto() {
        if (!stream) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        
        // Отражаем изображение, если используется фронтальная камера
        if (currentFacingMode === 'user') {
          context.translate(canvas.width, 0);
          context.scale(-1, 1);
        }
        
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Получаем данные фото
        const photoData = canvas.toDataURL('image/jpeg', 0.8);
        
        // Добавляем в состояние
        state.photos.push({
          id: Date.now() + Math.random(),
          data: photoData
        });

        // Обновляем сетку фото
        document.getElementById('photosGrid').innerHTML = renderPhotosGrid();
        nextBtn.disabled = false;
        nextBtn.textContent = `Далее (${state.photos.length} фото)`;

        // Добавляем обработчики для кнопок удаления
        attachPhotoHandlers();
      }

      function renderPhotosGrid() {
        if (state.photos.length === 0) {
          return '<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 20px;">Фото пока нет. Сделайте первый снимок.</div>';
        }

        return state.photos.map(photo => `
          <div class="photo-item" data-id="${photo.id}">
            <img src="${photo.data}" alt="Фото ДТП">
            <button class="remove-photo" onclick="removePhoto('${photo.id}')">×</button>
          </div>
        `).join('');
      }

      // Обработчики для шага 2
      startBtn.addEventListener('click', () => {
        if (stream) {
          stopCamera();
        } else {
          startCamera();
        }
      });

      captureBtn.addEventListener('click', capturePhoto);

      switchBtn.addEventListener('click', () => {
        currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
        startCamera(currentFacingMode);
      });

      backBtn.addEventListener('click', () => {
        stopCamera();
        state.currentStep = 1;
        renderStep();
      });

      nextBtn.addEventListener('click', () => {
        if (state.photos.length > 0) {
          stopCamera();
          state.currentStep = 3;
          renderStep3(); // следующий шаг
        }
      });

      // Очистка при уходе со страницы
      window.addEventListener('beforeunload', stopCamera);
    }

    // Вспомогательная функция для удаления фото
    window.removePhoto = function(photoId) {
      state.photos = state.photos.filter(p => p.id != photoId);
      
      // Обновляем сетку
      const photosGrid = document.getElementById('photosGrid');
      if (photosGrid) {
        photosGrid.innerHTML = renderPhotosGrid();
        attachPhotoHandlers();
      }
      
      // Обновляем кнопку далее
      const nextBtn = document.getElementById('nextStepBtn');
      if (nextBtn) {
        nextBtn.disabled = state.photos.length === 0;
        nextBtn.textContent = `Далее (${state.photos.length} фото)`;
      }
    };

    function attachPhotoHandlers() {
      // Функция пустая, так как обработчики через onclick в HTML
    }

    function renderPhotosGrid() {
      if (state.photos.length === 0) {
        return '<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 20px;">Фото пока нет. Сделайте первый снимок.</div>';
      }

      return state.photos.map(photo => `
        <div class="photo-item" data-id="${photo.id}">
          <img src="${photo.data}" alt="Фото ДТП">
          <button class="remove-photo" onclick="removePhoto('${photo.id}')">×</button>
        </div>
      `).join('');
    }

    // Заглушка для следующего шага
    function renderStep3() {
      contentDiv.innerHTML = `
        <div class="subtitle">Шаг 3 из 4</div>
        <div class="section-title">Данные участников</div>
        <p style="margin: 20px 0; color: var(--muted);">Здесь будет форма для ввода данных участников ДТП.</p>
        <div class="step-navigation">
          <button class="btn-back" id="backBtn">Назад</button>
          <button class="btn-next" id="nextBtn">Далее</button>
        </div>
      `;

      document.getElementById('backBtn').addEventListener('click', () => {
        state.currentStep = 2;
        renderStep();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        state.currentStep = 4;
        renderStep4();
      });
    }

    function renderStep4() {
      contentDiv.innerHTML = `
        <div class="subtitle">Шаг 4 из 4</div>
        <div class="section-title">Проверка и отправка</div>
        <p style="margin: 20px 0; color: var(--muted);">Тип ДТП: ${state.selectedType === 'serious' ? 'Серьёзное' : 'Европротокол'}</p>
        <p style="margin: 20px 0; color: var(--muted);">Сделано фото: ${state.photos.length}</p>
        <div class="step-navigation">
          <button class="btn-back" id="backBtn">Назад</button>
          <button class="btn-next" id="sendBtn">Отправить</button>
        </div>
      `;

      document.getElementById('backBtn').addEventListener('click', () => {
        state.currentStep = 3;
        renderStep3();
      });

      document.getElementById('sendBtn').addEventListener('click', () => {
        alert('Отправка данных (здесь будет запрос к API)');
        console.log('Отправляемые данные:', state);
      });
    }

    // Инициализация
    renderStep1();

    // Модалка авторизации (из вашего кода)
    const authModal = document.getElementById('authModal');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const authClose = document.getElementById('authClose');
    const authTitle = document.getElementById('authTitle');
    const authSubmit = document.getElementById('authSubmit');
    const toggleMode = document.getElementById('toggleMode');
    const repeatField = document.getElementById('repeatField');
    const legalText = document.getElementById('legalText');

    let mode = 'login';

    function openAuth(m) {
      mode = m;
      updateAuthUI();
      authModal.classList.add('visible');
    }

    function closeAuth() {
      authModal.classList.remove('visible');
      // Сброс полей
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      document.getElementById('password2').value = '';
    }

    function updateAuthUI() {
      if (mode === 'login') {
        authTitle.textContent = 'Вход';
        authSubmit.textContent = 'Войти';
        toggleMode.textContent = 'Нет аккаунта? Регистрация';
        repeatField.style.display = 'none';
        legalText.textContent = 'Используйте e‑mail и пароль, указанные при регистрации.';
      } else {
        authTitle.textContent = 'Регистрация';
        authSubmit.textContent = 'Создать аккаунт';
        toggleMode.textContent = 'Уже есть аккаунт? Войти';
        repeatField.style.display = 'flex';
        legalText.textContent = 'Создавая аккаунт, вы принимаете условия сервиса и даёте согласие на обработку персональных данных.';
      }
    }

    loginBtn.addEventListener('click', () => openAuth('login'));
    signupBtn.addEventListener('click', () => openAuth('signup'));
    authClose.addEventListener('click', closeAuth);

    toggleMode.addEventListener('click', () => {
      mode = mode === 'login' ? 'signup' : 'login';
      updateAuthUI();
    });

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) closeAuth();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && authModal.classList.contains('visible')) {
        closeAuth();
      }
    });

    authSubmit.addEventListener('click', (e) => {
      e.preventDefault();
      console.log('AUTH SUBMIT, mode:', mode, {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        password2: document.getElementById('password2').value
      });
    });
  </script>
